name: Build ExteraLight 2025

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release ExteraLight APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK Tools & Graphics Utilities
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using build tools from $BUILD_TOOLS_DIR"
          echo "BUILD_TOOLS=$BUILD_TOOLS_DIR" >> $GITHUB_ENV
          sudo apt-get update && sudo apt-get install -y zipalign librsvg2-bin

      - name: Download Tools & Base APK
        run: |
          curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          curl -L -o base.apk https://github.com/Nekogram/Nekogram/releases/download/v13.1.1/Nekogram-13.1.1-7237-arm64-v8a.apk
          ls -lh base.apk apktool.jar

      - name: Decompile Base APK (Zero-Crash Mode)
        run: |
          java -jar apktool.jar d -f -r base.apk -o decompiled
          ls -la decompiled/

      - name: Patch Smali, Manifest & ARSC
        run: |
          python3 patch_exteralight.py

      - name: Rebuild APK
        run: |
          java -jar apktool.jar b decompiled -o ExteraLight-unaligned.apk

      - name: Patch Icons & Vectors into Built APK
        run: |
          python3 patch_exteralight.py --post-build

      - name: Align & Sign APK
        run: |
          keytool -genkeypair -v -keystore exteralight.jks -alias exteralight -keyalg RSA -keysize 2048 -validity 10000 -storepass exteralight123 -keypass exteralight123 -dname "CN=ExteraLight, O=ExteraLight, C=US"
          $BUILD_TOOLS/zipalign -v -p 4 ExteraLight-unaligned.apk ExteraLight-arm64-v8a.apk
          $BUILD_TOOLS/apksigner sign --ks exteralight.jks --ks-pass pass:exteralight123 --ks-key-alias exteralight --key-pass pass:exteralight123 --out ExteraLight-arm64-v8a-signed.apk ExteraLight-arm64-v8a.apk
          $BUILD_TOOLS/apksigner verify ExteraLight-arm64-v8a-signed.apk
          mv ExteraLight-arm64-v8a-signed.apk ExteraLight-arm64-v8a.apk
          ls -lh ExteraLight-arm64-v8a.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExteraLight-arm64-v8a
          path: ExteraLight-arm64-v8a.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          name: "ExteraLight v2.0.1 (Modern Base 2025 + Classic UI 2023 - Crash-Free)"
          body: |
            ### ⚡ ExteraLight v2.0.1 Release (Crash-Free Hotfix)
            **Modern Telegram with Stars, Gifts, and Classic 2023 Telegram Interface**

            - ⭐ **Telegram Stars (Звёзды)**: Full support for Telegram Stars, reactions, and Star bot payments (Layer 180+).
            - 🎁 **Telegram Gifts (Подарки)**: Full support for Telegram Gifts and collectibles showcase on profiles.
            - 🏛️ **Classic 2023 Telegram Design**: Clean, unbloated, ultra-smooth Telegram UI without Material You lag.
            - 💡 **ExteraLight Icon**: Brand new custom Lightbulb + Telegram branding across launcher, splash, and system.
            - 🐾 **Easter Egg**: Tap the logo/version in settings 5 times for the surprise ("Мур мяу!!").
            - 🛠️ **Crash Fix**: Preserved original binary resource table to completely prevent startup crashes.
            - 🔄 **Direct Update**: Incremented build version (`versionCode: 72600`) so you can update over v2.0.0 directly.
            - 📦 **Architecture**: arm64-v8a (Android 6.0+)
          files: ExteraLight-arm64-v8a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
