name: Build ExteraLight 2025

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release ExteraLight APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK Tools
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using build tools from $BUILD_TOOLS_DIR"
          echo "BUILD_TOOLS=$BUILD_TOOLS_DIR" >> $GITHUB_ENV
          sudo apt-get update && sudo apt-get install -y zipalign

      - name: Download Tools & Base APK
        run: |
          curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          curl -L -o base.apk https://github.com/Nekogram/Nekogram/releases/download/v13.1.1/Nekogram-13.1.1-7237-arm64-v8a.apk
          ls -la base.apk apktool.jar

      - name: Decompile Base APK
        run: |
          java -jar apktool.jar d -f base.apk -o decompiled

      - name: Patch ExteraLight Branding & Easter Egg
        run: |
          python3 patch_exteralight.py

      - name: Rebuild APK
        run: |
          java -jar apktool.jar b decompiled -o ExteraLight-unaligned.apk

      - name: Align & Sign APK
        run: |
          $BUILD_TOOLS/zipalign -v -p 4 ExteraLight-unaligned.apk ExteraLight-arm64-v8a.apk
          $BUILD_TOOLS/apksigner sign --ks TMessagesProj/config/extera.jks --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out ExteraLight-arm64-v8a-signed.apk ExteraLight-arm64-v8a.apk
          $BUILD_TOOLS/apksigner verify ExteraLight-arm64-v8a-signed.apk
          mv ExteraLight-arm64-v8a-signed.apk ExteraLight-arm64-v8a.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExteraLight-arm64-v8a
          path: ExteraLight-arm64-v8a.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "ExteraLight v2.0.0 (Modern Base 2025 + Classic UI 2023)"
          body: |
            ### ⚡ ExteraLight v2.0.0 Release
            **Modern Telegram with Stars, Gifts, and Classic 2023 Telegram Interface**

            - ⭐ **Telegram Stars (Звёзды)**: Full support for Telegram Stars, reactions, and Star bot payments.
            - 🎁 **Telegram Gifts (Подарки)**: Full support for Telegram Gifts and collectibles showcase on profiles.
            - 🏛️ **Classic 2023 Telegram Design**: Clean, unbloated, fast native Telegram UI without Material You slop or lag.
            - 💡 **ExteraLight Icon**: Brand new custom Lightbulb + Telegram branding across launcher and system.
            - 🐾 **Easter Egg**: Tap the logo/version in settings 5 times for the surprise ("Мур мяу!!").
            - 📦 **Architecture**: arm64-v8a (Android 6.0+)
          files: ExteraLight-arm64-v8a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
